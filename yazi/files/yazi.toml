[manager]
show_hidden = true
sort_by = "alphabetical"
sort_dir_first = true

[opener]
edit = [
    { run = 'hx "$@"', block = true, for = "unix" }
]

[open]
rules = [
    { name = "*/", use = "edit" },
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-yaml", use = "edit" },
    { mime = "application/toml", use = "edit" },
    { name = "*.rs", use = "edit" },
    { name = "*.go", use = "edit" },
    { name = "*.sls", use = "edit" },
    { name = "*.nu", use = "edit" },
    { name = "*.kdl", use = "edit" },
]
