# Output and File Pathing
--output "%(playlist)s/%(playlist_index)s - %(title)s.%(ext)s"
--parse-metadata "%(playlist_index)s:%(track_number)s"
--no-overwrites
--no-part
--no-mtime

# Automation and Playlists
--yes-playlist
--ignore-errors
--mark-watched

# Quality & Post-Processing
--format "bestvideo+bestaudio/best"
--audio-quality 0
--embed-metadata
--xattrs

# Binary Paths & Cache Performance
--ffmpeg-location /opt/ffmpeg/bin/ffmpeg
--rm-cache-dir
--continue
