{% from "opensmtpd/map.jinja" import opensmtpd with context %}

pki opensmtpd certificate "/opt/opensmtpd/etc/ssl/opensmtpd.crt"
pki opensmtpd key "/opt/opensmtpd/etc/ssl/opensmtpd.key"

table aliases file:/opt/opensmtpd/etc/aliases
table vusers file:/opt/opensmtpd/etc/vusers
table domains file:/opt/opensmtpd/etc/domains
table passwd passwd:/opt/opensmtpd/etc/passwd

listen on lo port 25 tls pki opensmtpd
listen on lo port 587 tls-require pki opensmtpd auth <passwd>
listen on all port 25 tls pki opensmtpd
listen on all port 587 tls-require pki opensmtpd auth <passwd>

action "local_mail" lmtp "/opt/dovecot/lmtp" rcpt-to alias <aliases>
action "virtual_mail" lmtp "/opt/dovecot/lmtp" rcpt-to virtual <vusers>
action "outbound" relay

match from local for local action "local_mail"
match from any for domain <domains> action "virtual_mail"
match from local for any action "outbound"
match auth from any for any action "outbound"
