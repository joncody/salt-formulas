-- ==============================================================================
-- Conky Bottom-Center Panel (Jitter-Free Monospace Spacing)
-- ==============================================================================

conky.config = {
    -- Geometry & Placement (Bottom Center, Flush)
    alignment = 'bottom_middle',
    gap_x = 0,
    gap_y = 0,
    minimum_width = 10,
    maximum_width = 1800,
    minimum_height = 22,
    border_inner_margin = 4,
    border_outer_margin = 0,

    -- Compiz Window & Working Transparency Settings
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 175,
    own_window_colour = '000000',

    -- Rendering & Anti-Flicker
    double_buffer = true,
    no_buffers = true,
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,

    -- Monospace Padding (Stops digit jumps from shifting margins)
    use_spacer = 'left',

    -- Global Typography
    use_xft = true,
    font = 'Hack Nerd Font:size=9',
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    -- Colors
    default_color = '#ffffff',
    color1 = '#aaaaaa',
    color2 = '#555555',
    color3 = '#83a598',
}

conky.text = [[
${voffset 3}  ${color1} ${color}${nodename} ${color2}│\
${color1}  CPU:${color} ${cpu cpu0}% (${freq_g}GHz) ${color2}│\
${color1} 󰍛 RAM:${color} $mem / $memmax (${memperc}%) ${color2}│\
${color1} 󰋊 Disk:${color} ${fs_used /} / ${fs_size /} ${color2}│\
${color1} 󰈀 IP:${color3} ${exec ip -br -4 addr show scope global 2>/dev/null | awk '!/docker|br-|vir|mp/ {split($3,a,"/"); printf "%s (%s) ", a[1], $1}' | awk '{print ($0=="" ? "Disconnected" : $0)}'}${color} ${color2}│\
${color1} 󰔛 ${color}${uptime_short} ${color2}│\
${color1} 󰃭 ${color}${time %a, %b %d} ${color2}│\
${color1} 󰥔 ${color}${time %H:%M:%S}  \
]]
