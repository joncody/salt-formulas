# Clear any existing rulesets to ensure a clean reload of the configuration
flush ruleset

# The 'inet' table family handles both IPv4 and IPv6 traffic under a single unified ruleset
table inet filter {

	# Dynamic set for IPv4 SSH (port 22) brute-force rate-limiting
	set DEFAULT {
		type ipv4_addr
		size 65535
		flags dynamic,timeout
		timeout 30s
	}

	# Dynamic set for IPv6 SSH (port 22) brute-force rate-limiting
	set DEFAULT_V6 {
		type ipv6_addr
		size 65535
		flags dynamic,timeout
		timeout 30s
	}

	# Custom chain for port scanning detection
	chain port_scanning {
		# Allow normal TCP resets (RSTs) up to 1/second. Drop anything faster.
		tcp flags rst / fin,syn,rst,ack limit rate 1/second burst 2 packets return
		drop
	}

	# Custom chain for SYN flood protection (global limit)
	chain syn_flood {
		# Allow up to 100 SYN packets per second globally. Drop anything faster.
		limit rate 100/second burst 150 packets return
		drop
	}

	chain INPUT {
		type filter hook input priority filter; policy drop;

		# 1. Trust loopback interface (local-only communications)
		iifname "lo" accept
		iifname "docker0" accept
		iifname "br-*" accept
		iifname "mpbr*" accept
		iifname "mpqemubr*" accept
		iifname "virbr*" accept

		# 2. State machine: Accept established/related traffic, drop invalid packets
		ct state established,related accept
		ct state invalid drop

		# 3. Drop malicious TCP scans (Xmas and Null scans)
		tcp flags fin,syn,rst,psh,ack,urg / fin,syn,rst,psh,ack,urg drop
		tcp flags & (fin|syn|rst|psh|ack|urg) == 0 drop # Bitwise check for Null scans (highly portable)

		# 4. Drop fragmented IPv4 packets (0x1fff isolates the fragment offset field)
		ip frag-off & 0x1fff != 0x0 drop

		# 5. SSH brute-force rate-limiting (NEW connections only)
		# Restricts any single IP to 10 connections per minute with a burst of 5
		tcp dport 22 ct state new update @DEFAULT { ip saddr limit rate over 10/minute burst 5 packets } drop
		tcp dport 22 ct state new update @DEFAULT_V6 { ip6 saddr limit rate over 10/minute burst 5 packets } drop

		# 6. Audit TCP traffic BEFORE accepting packets on open ports
		# 'meta l4proto tcp' ensures the port scan audit evaluates both IPv4 and IPv6
		meta l4proto tcp jump port_scanning
		tcp flags syn / fin,syn,rst,ack jump syn_flood

		# 7. IPv4 ICMP Rules
		ip protocol icmp limit rate 1/second burst 1 packets accept
		ip protocol icmp log prefix "PING-DROP:" drop

		# 8. IPv6 ICMPv6 Rules
		# Allows Neighbor Discovery (Router/Neighbor Solicitation/Advertisement) - Mandatory for IPv6 to function
		icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		# Rate limit IPv6 pings (Echo Requests) and log/drop packets exceeding the limit
		icmpv6 type echo-request limit rate 1/second burst 1 packets accept
		icmpv6 type echo-request log prefix "PING-DROP-v6:" drop

		# 9. Accept legitimate new connections to allowed services
		# Evaluation ends here for valid packets matching these ports
		tcp dport { 22, 25, 80, 110, 143, 443, 993, 995, 8080, 8081 } ct state new accept
	}

	chain FORWARD {
		type filter hook forward priority filter; policy accept;
	}

	chain OUTPUT {
		type filter hook output priority filter; policy accept;
	}
}
